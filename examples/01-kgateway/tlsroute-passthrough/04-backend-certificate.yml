apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passthrough-backend-cert
  namespace: 01-kgateway-tlsroute-passthrough
spec:
  secretName: passthrough-backend-cert-secret
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  isCA: false
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - "www.example2.com"
    - "example2.com"
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
