apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: http-listener-set
  namespace: 01-kgateway-http-route
spec:
  parentRef:
    name: http-gateway
    kind: Gateway
    group: gateway.networking.k8s.io
    namespace: kgateway-system
  listeners:
    - name: http-listener-set
      hostname: www.example2.com
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
