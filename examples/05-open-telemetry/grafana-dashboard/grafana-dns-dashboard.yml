apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dns-dashboard
  labels:
    grafana_dashboard: "1"
data:
  dns-ebpf.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "DNS Requests per Pod (eBPF)",
          "type": "table",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (k8s_pod_name, dns_question_name) (dns_lookup_duration_seconds_count)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"k8s_pod_name": "Pod", "dns_question_name": "DNS Name", "Value": "Request Count"}}}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"align": "auto"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Request Count"}, "properties": [{"id": "custom.width", "value": 150}]}
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Request Count"}]
          }
        },
        {
          "title": "DNS Lookup Duration per Pod (eBPF)",
          "type": "table",
          "gridPos": {"h": 16, "w": 24, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sort_desc(sum by (k8s_pod_name, dns_question_name) (dns_lookup_duration_seconds_sum) / sum by (k8s_pod_name, dns_question_name) (dns_lookup_duration_seconds_count))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"k8s_pod_name": "Pod", "dns_question_name": "DNS Name", "Value": "Avg Duration (s)"}}}
          ],
          "fieldConfig": {
            "defaults": {"unit": "s", "decimals": 4, "custom": {"align": "auto", "cellOptions": {"type": "gauge", "mode": "gradient"}, "inspect": true}, "color": {"mode": "fixed", "fixedColor": "green"}, "min": 0},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Pod"}, "properties": [{"id": "custom.width", "value": 400}, {"id": "custom.cellOptions", "value": {"type": "auto"}}]}
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Avg Duration (s)"}]
          }
        }
      ],
      "schemaVersion": 39,
      "title": "DNS Requests (eBPF)",
      "uid": "dns-ebpf-dashboard",
      "version": 10
    }
